<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Center Line Punkte Rechner</title>
  <style>
    :root {
      --bayer-blue: #0091df;
      --bayer-blue-dark: #0073b3;
      --bayer-green: #89d329;
      --text-dark: #333333;
      --text-light: #767676;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --border-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      color: var(--text-dark);
    }

    .card {
      background: var(--card-bg);
      padding: 32px 24px 24px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      max-width: 520px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    /* Bayer-Farbverlauf am oberen Rand */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--bayer-blue) 0%, var(--bayer-green) 100%);
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo-container {
      margin-bottom: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-container img {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }

    .header-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--bayer-blue);
      margin-bottom: 6px;
      text-align: center;
    }

    .header-sub {
      font-size: 0.85rem;
      color: var(--text-light);
      text-align: center;
    }

    .rows-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .row:hover {
      border-color: #b3d4ee;
      box-shadow: 0 2px 6px rgba(0, 145, 223, 0.08);
    }

    .row.disabled {
      opacity: 0.5;
      background: #fafafa;
    }

    .checkbox-wrap {
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .checkbox-wrap input[type="checkbox"] {
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: var(--bayer-blue);
      flex-shrink: 0;
    }

    .name-input {
      flex: 1;
      min-width: 0; /* WICHTIG: Erlaubt dem Textfeld, auf Handys schmaler zu werden */
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-dark);
      border: 1px solid transparent;
      background: transparent;
      padding: 6px 8px;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s;
    }

    .name-input:focus {
      background: #fff;
      border-color: var(--bayer-blue);
    }

    .num-input {
      width: 60px;
      flex-shrink: 0; /* Verhindert, dass das Zahlenfeld zerquetscht wird */
      height: 36px;
      background: #f9f9f9;
      color: var(--text-dark);
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      outline: none;
      transition: all 0.2s ease;
    }

    .num-input:focus {
      border-color: var(--bayer-blue);
      box-shadow: 0 0 0 2px rgba(0, 145, 223, 0.15);
      background: #fff;
    }

    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      opacity: 1;
    }

    .footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sum-label {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .sum-display {
      background: var(--bayer-blue);
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 20px;
      min-width: 60px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 145, 223, 0.3);
    }

    .btn-reset {
      margin-top: 24px;
      width: 100%;
      background: transparent;
      border: 1px solid #dcdcdc;
      color: var(--text-light);
      padding: 10px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-reset:hover {
      background: #f4f6f8;
      color: var(--text-dark);
      border-color: #b0b0b0;
    }

    /* --- MOBILE ANPASSUNGEN --- */
    @media (max-width: 480px) {
      body {
        padding: 8px; /* Weniger Rand außen auf dem Handy */
      }
      .card {
        padding: 24px 12px 16px; /* Weniger Rand innen */
      }
      .row {
        gap: 8px;
        padding: 6px 8px;
      }
      .name-input {
        font-size: 0.95rem; /* Schriftgröße minimal anpassen */
      }
      .num-input {
        width: 50px; /* Zahlenfeld auf Handys etwas schmaler machen */
      }
    }
  </style>
</head>
<body>

      <div class="header-title">Center Line Punkte</div>
      <div class="header-sub">Anlagenteile an-/abwählen • Namen & Punkte direkt anpassen</div>
    </div>

    <div class="rows-container" id="itemsContainer"></div>

    <div class="footer">
      <div class="sum-label">Aktive Punkte:</div>
      <div class="sum-display" id="totalDisplay">0</div>
    </div>

    <button class="btn-reset" onclick="resetToDefault()">Standardwerte wiederherstellen</button>
  </div>

  <script>
    const defaultData = [
      { name: "Mediseal", value: 16, active: true },
      { name: "Austrageband", value: 7, active: true },
      { name: "Bookletzuführung", value: 6, active: true },
      { name: "Tubenfüller", value: 0, active: true },
      { name: "GUK", value: 12, active: true },
      { name: "Applikator Zuführung", value: 2, active: true },
      { name: "Kartonierer", value: 19, active: true },
      { name: "Seidenader", value: 4, active: true },
      { name: "Bündler", value: 6, active: true },
      { name: "Endverpacker", value: 8, active: true }
    ];

    let items = [];

    function loadData() {
      const saved = localStorage.getItem("centerline_app_data_v6");
      if (saved) {
        try {
          items = JSON.parse(saved);
        } catch(e) {
          items = JSON.parse(JSON.stringify(defaultData));
        }
      } else {
        items = JSON.parse(JSON.stringify(defaultData));
      }
      render();
    }

    function saveData() {
      localStorage.setItem("centerline_app_data_v6", JSON.stringify(items));
      calculateTotal();
    }

    function render() {
      const container = document.getElementById("itemsContainer");
      container.innerHTML = "";

      items.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = `row ${item.active ? '' : 'disabled'}`;
        row.id = `row-${index}`;

        row.innerHTML = `
          <label class="checkbox-wrap" title="Komponente aktivieren/deaktivieren">
            <input type="checkbox" ${item.active ? 'checked' : ''} onchange="toggleItem(${index}, this.checked)">
          </label>
          <input type="text" class="name-input" value="${escapeHtml(item.name)}" 
                 title="Klicken zum Umbenennen"
                 onchange="updateName(${index}, this.value)">
          <input type="number" min="0" max="999" class="num-input" value="${item.value}" 
                 title="Punkte eingeben"
                 onchange="updateValue(${index}, this.value)">
        `;

        container.appendChild(row);
      });

      calculateTotal();
    }

    function toggleItem(index, isChecked) {
      items[index].active = isChecked;
      const row = document.getElementById(`row-${index}`);
      if (isChecked) {
        row.classList.remove('disabled');
      } else {
        row.classList.add('disabled');
      }
      saveData();
    }

    function updateName(index, val) {
      items[index].name = val;
      saveData();
    }

    function updateValue(index, val) {
      items[index].value = parseInt(val, 10) || 0;
      saveData();
    }

    function calculateTotal() {
      const total = items.reduce((sum, item) => item.active ? sum + (item.value || 0) : sum, 0);
      const display = document.getElementById("totalDisplay");
      display.textContent = total < 10 ? '0' + total : total.toString();
    }

    function resetToDefault() {
      if(confirm("Möchtest du wirklich alle Namen und Zahlen auf den Originalzustand zurücksetzen?")) {
        items = JSON.parse(JSON.stringify(defaultData));
        saveData();
        render();
      }
    }

    function escapeHtml(text) {
      return text.replace(/"/g, '&quot;');
    }

    loadData();
  </script>
</body>
</html>
